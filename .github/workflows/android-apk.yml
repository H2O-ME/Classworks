name: Android 客户端

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: heredoc 与 secret 测试
        env:
          SECRET_X: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SECRET_X" ]; then echo has-keystore; else echo no-keystore; fi
          cat > /tmp/x.properties <<EOF
          a=1
          EOF
          cat /tmp/x.properties
