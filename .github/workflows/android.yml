name: Android 客户端

# 手动触发或推 android-v* 标签。
# 安卓构建链（JDK + Android SDK + NDK + Gradle）全在 runner 上装，本机不需要环境。
on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

permissions:
  contents: write


concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：它默认装已下线的 "tools" 包，直接失败。
      # ubuntu-latest 镜像自带 Android SDK（/usr/local/lib/android/sdk），只需补装缺的组件。
      - name: 安装 Android SDK 组件
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1); fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" > /dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: android

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/gen/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 生成 Android 工程
        working-directory: client
        run: pnpm dlx @tauri-apps/cli@^2 android init --ci

      # init 生成的是默认 Tauri 图标；用仓库里准备好的自适应图标覆盖
      # （android-icons/android/* 由 tauri icon 生成，含 mipmap 各密度 + adaptive xml）
      - name: 应用应用图标
        run: |
          if [ ! -d client/android-icons/android ]; then
            echo "client/android-icons/android 不存在，保持默认图标" >&2
          else
            cp -r client/android-icons/android/. client/gen/android/app/src/main/res/
            ls client/gen/android/app/src/main/res/mipmap-xxxhdpi/
          fi

      - name: 准备签名密钥
        working-directory: client/gen/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > classworks.keystore
            STORE_PASSWORD="$STORE_PASS"
            echo "使用仓库 Secrets 里的 keystore"
          else
            keytool -genkeypair -v -keystore classworks.keystore -alias classworks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass classworks2026 -keypass classworks2026 \
              -dname "CN=Classworks, OU=Class, O=Classworks, L=CN, C=CN"
            STORE_PASSWORD="classworks2026"
            base64 -w0 classworks.keystore > classworks.keystore.b64
            echo "现场生成 keystore（首次；把它存进 Secrets 保证后续签名一致）"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=classworks\nkeyPassword=%s\n' \
            "$(pwd)/classworks.keystore" "$STORE_PASSWORD" "$STORE_PASSWORD" > keystore.properties
          echo "KEYSTORE_PASS=$STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: 构建 APK
        working-directory: client
        run: pnpm dlx @tauri-apps/cli@^2 android build --apk --ci

      # 兜底：无论 Gradle 是否套用了 signingConfig，都用 apksigner 再签一次，
      # 保证产物一定能装（未签名的 release APK 装不上）
      - name: 签名 APK
        working-directory: client/gen/android
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "原始 APK: $APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | tail -1)
          mkdir -p signed
          "$BT/apksigner" sign --ks classworks.keystore \
            --ks-pass "pass:$KEYSTORE_PASS" --key-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias classworks --out "signed/Classworks.apk" "$APK"
          "$BT/apksigner" verify --print-certs "signed/Classworks.apk" | head -4

      - name: 收集产物
        run: |
          mkdir -p out
          cp client/gen/android/signed/Classworks.apk out/Classworks.apk
          ls -la out/
          if [ -f client/gen/android/classworks.keystore.b64 ]; then cp client/gen/android/classworks.keystore.b64 out/; fi

      - uses: actions/upload-artifact@v4
        with:
          name: classworks-android-apk
          retention-days: 30
          path: out/*

      # 推 android-v* 标签时挂 Release，手机可直接下载安装
      # 注意：只传 APK，keystore.b64 绝不能进 Release（那是签名私钥）
      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Classworks Android ${{ github.ref_name }}
          body: |
            Android 客户端（Tauri 薄壳，加载线上看板）。

            - 直接安装 `Classworks.apk`；首次需在系统设置里允许「未知来源应用」
            - 要求 **Android 7.0+**（minSdk 24）
            - 自签证书，非应用商店分发；升级需覆盖安装同一签名的新版
            - 页面内容自动更新（网页发版即生效），APK 自身改版才需重新安装
          files: out/Classworks.apk