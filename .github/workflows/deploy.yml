name: CI/CD

# push 到 main：构建后端镜像(GHCR) + 前端产物，并 SSH 到服务器自动部署
on:
  push:
    branches: [main]
  workflow_dispatch: # 手动触发入口，方便重跑

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-server

jobs:
  backend:
    name: 后端镜像 → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: 前端构建 + 自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 数据层自检
        run: node src/utils/selfcheck.mjs

      - name: 瀑布流自检
        run: node scripts/ui-check.mjs

      # 生产基址用 .env.production 默认值（API 同源 + 白板口令），不在 CI 重复维护
      - name: 构建
        run: pnpm build

      - name: PWA 产物自检
        run: node scripts/pwa-check.mjs

      - name: 打包 dist
        run: tar -czf dist.tgz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tgz
          retention-days: 14

  deploy:
    name: 部署到服务器
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 上传前端产物与 compose 配置
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} \
            dist.tgz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/classworks/frontend-new.tgz
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} \
            server/docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/classworks/server/docker-compose.yml

      - name: 执行部署（后端拉新镜像 + 前端原子切换）
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'set -e
             mkdir -p /opt/classworks/frontend-new
             tar -xzf /opt/classworks/frontend-new.tgz -C /opt/classworks/frontend-new
             rm /opt/classworks/frontend-new.tgz
             /opt/classworks/bin/deploy.sh all'
