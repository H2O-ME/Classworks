name: CI/CD

# push 到 main：构建后端镜像(GHCR) + 前端产物，并 SSH 到服务器自动部署
on:
  push:
    branches: [main]
    # 只有前端/后端代码变了才需要重新部署；
    # 改客户端、文档、CI 配置不该占部署队列（排队期间旧 run 还会把线上回滚成旧版）
    paths-ignore:
      - ".github/**"
      - "client/**"
      - "win/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch: # 手动触发入口，方便重跑

concurrency:
  # 同一分支只允许一个部署：新 run 进来直接取消排队/进行中的旧 run，
  # 避免「多个旧 commit 依次部署」把线上越滚越旧
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR 镜像名必须全小写，不能用 github.repository（含大写）
  IMAGE_NAME: h2o-me/classworks-server

jobs:
  backend:
    name: 后端镜像 → GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: 前端构建 + 自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 数据层自检
        run: node src/utils/selfcheck.mjs

      - name: 瀑布流自检
        run: node scripts/ui-check.mjs

      # 生产基址用 .env.production 默认值（API 同源 + 白板口令），不在 CI 重复维护
      - name: 构建
        run: pnpm build

      - name: PWA 产物自检
        run: node scripts/pwa-check.mjs

      - name: 打包 dist
        run: tar -czf dist.tgz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tgz
          retention-days: 14

  deploy:
    name: 部署到服务器
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: 部署（过期提交自动跳过）
        run: |
          # 守卫：排队期间又推了新提交时，这个 run 的代码已经过期。
          # 若照常部署，会把线上覆盖回旧版本 —— 比不部署更糟。
          LATEST=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            echo "跳过部署：本 run 的提交 $GITHUB_SHA 已不是 main 最新（$LATEST）"
            exit 0
          fi

          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} \
            dist.tgz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/classworks/frontend-new.tgz
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} \
            server/docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/classworks/server/docker-compose.yml
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'set -e
             mkdir -p /opt/classworks/frontend-new
             tar -xzf /opt/classworks/frontend-new.tgz -C /opt/classworks/frontend-new
             rm /opt/classworks/frontend-new.tgz
             /opt/classworks/bin/deploy.sh all'
