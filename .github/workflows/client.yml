name: Windows 客户端

# 手动触发：只上传 artifact（自用/试装）
# 推 client-v* 标签：构建并把安装包挂到 GitHub Release（便于教室电脑直接下载）
# 不在每次 push main 时构建：客户端只有壳，几乎不变，没必要每次烧 runner
on:
  workflow_dispatch:
  push:
    tags: ["client-v*"]

permissions:
  contents: write

jobs:
  build:
    name: 构建 Tauri 客户端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest 没预装 pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      # NSIS 打包由 tauri-cli 自己下载，不需要额外装 WiX/NSIS
      - name: 构建（安装包 + 绿色 exe）
        run: pnpm dlx @tauri-apps/cli@^2 build
        working-directory: client

      - uses: actions/upload-artifact@v4
        with:
          name: classworks-client-windows
          retention-days: 30
          path: |
            client/target/release/classworks-board.exe
            client/target/release/bundle/nsis/*.exe

      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          name: 作业看板客户端 ${{ github.ref_name }}
          body: |
            Windows 客户端（未签名，首次运行会提示「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」）。

            - `作业看板_x.y.z_x64-setup.exe` —— 安装版（推荐，自动进开始菜单）
            - `classworks-board.exe` —— 绿色版，放非还原分区（如 `D:\Classworks\`）直接双击

            客户端只加载线上看板，**网页发版后客户端自动就是新版**，不需要重新下载。
          files: |
            client/target/release/bundle/nsis/*.exe
            client/target/release/classworks-board.exe
