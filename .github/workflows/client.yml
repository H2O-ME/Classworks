name: Windows 客户端

# 手动触发：只上传 artifact（自用/试装）
# 推 client-v* 标签：构建并把安装包挂到 GitHub Release（便于教室电脑直接下载）
# 不在每次 push main 时构建：客户端只有壳，几乎不变，没必要每次烧 runner
on:
  workflow_dispatch:
  push:
    tags: ["client-v*"]

permissions:
  contents: write


concurrency:
  # 同一标签/分支只跑一个：重复触发直接取消旧的，别把 runner 队列塞满
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Tauri 客户端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest 没预装 pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # 缓存 ~/.cargo 与 client/target：第二次起只编改动的 crate
          workspaces: client
          cache-on-failure: true
          # 保留历史缓存，避免每次全新编译依赖树
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/client-v') }}

      # NSIS 打包由 tauri-cli 自己下载，不需要额外装 WiX/NSIS
      - name: 构建（安装包 + 绿色 exe）
        run: pnpm dlx @tauri-apps/cli@^2 build
        working-directory: client
        env:
          # 更新包签名私钥：没它就不会产出 .sig，客户端更新校验会失败
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # 更新清单放自己服务器：仓库是私有的，匿名拉不到 GitHub Release 资产
      - name: 生成 latest.json
        shell: pwsh
        run: |
          $version = (Get-Content client/tauri.conf.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem "client/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $setup) { throw "找不到安装包" }
          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "缺少 $sigPath（TAURI_SIGNING_PRIVATE_KEY 未生效？）" }
          $name = "Classworks_${version}_x64-setup.exe"
          $payload = [ordered]@{
            version   = $version
            notes     = "Classworks 客户端 $version"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sigPath -Raw).Trim()
                url       = "https://classworks.tianhw.top/updates/$name"
              }
            }
          }
          $payload | ConvertTo-Json -Depth 6 | Set-Content "client/target/release/latest.json" -Encoding utf8NoBOM
          Copy-Item $setup.FullName "client/target/release/$name"
          Write-Host "更新清单: version=$version"

      - name: 发布更新清单与安装包到服务器
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "client/target/release/latest.json,client/target/release/*_x64-setup.exe"
          target: "/www/wwwroot/classworks/updates"
          strip_components: 4
          overwrite: true

      - uses: actions/upload-artifact@v4
        with:
          name: classworks-client-windows
          retention-days: 30
          path: |
            client/target/release/classworks-board.exe
            client/target/release/bundle/nsis/*.exe

      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Classworks 客户端 ${{ github.ref_name }}
          body: |
            Windows 客户端（未签名，首次运行会提示「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」）。

            - `Classworks_x.y.z_x64-setup.exe` —— 安装版（开始菜单 + 卸载项，适合非还原机器）
            - `classworks-board.exe` —— 绿色版，放非还原分区（如 `D:\Classworks\`）直接双击，适合冰点还原机器

            客户端只加载线上看板，**网页发版后客户端自动就是新版**，不需要重新下载。
          files: |
            client/target/release/bundle/nsis/*.exe
            client/target/release/classworks-board.exe