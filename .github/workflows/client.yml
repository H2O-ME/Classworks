name: Windows 客户端

# 手动触发，或推 client-v* 标签时出包。
# 不在每次 push main 时构建：客户端只有壳，几乎不变，没必要每次都烧 runner。
on:
  workflow_dispatch:
  push:
    tags: ["client-v*"]

jobs:
  build:
    name: 构建 Tauri 客户端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      # NSIS 打包由 tauri-cli 自己下载，不需要额外装 WiX/NSIS
      - name: 构建（安装包 + 绿色 exe）
        run: pnpm dlx @tauri-apps/cli@^2 build
        working-directory: client

      - uses: actions/upload-artifact@v4
        with:
          name: classworks-client-windows
          retention-days: 30
          path: |
            client/target/release/classworks-board.exe
            client/target/release/bundle/nsis/*.exe
