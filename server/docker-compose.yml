services:
  api:
    # CI 构建好的镜像从 GHCR 拉取（GitHub Actions 推送）；本地开发想现场构建时：
    #   docker compose build --build-context .  或直接 docker build -t ghcr.io/h2o-me/classworks-server .
    image: ghcr.io/h2o-me/classworks-server:latest
    container_name: classworks-server
    restart: unless-stopped
    env_file: .env
    # 只暴露给本机反代（Caddy/Nginx），公网不直接访问 3100。
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - classworks-data:/app/data

volumes:
  classworks-data:
