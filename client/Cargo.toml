[package]
name = "classworks-board"
version = "0.2.2"
description = "Classworks 教室大屏客户端"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde_json = "1"

[profile.release]
# 编译速度优先（CI 每次出包都要全量编）：
#   lto="thin" 比 fat LTO 快一倍以上，体积只大一点
#   codegen-units=1 会让编译串行化，明显变慢，用默认 16
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
