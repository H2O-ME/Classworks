<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <title>作业看板</title>
    <style>
      html, body { height: 100%; margin: 0; background: #111111; color: #f3f3f3; font: 14px/1.6 system-ui, sans-serif; }
      .boot { display: grid; place-items: center; height: 100%; }
    </style>
  </head>
  <body>
    <!-- 占位页：正常情况窗口直接加载线上看板，看不到这里；
         仅在远程地址不可达时作为兜底提示（避免白屏） -->
    <div class="boot">
      <div>
        <p>正在打开作业看板…</p>
        <p style="opacity:.6">如果长时间停在这里，请检查网络连接。</p>
      </div>
    </div>
  </body>
</html>
