<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Android 旧式（非 adaptive）launcher 图标：整图会再被系统裁成圆形/圆角方形，
    所以内容必须收在中央约 45%，否则圆角裁切会切到卡片边。
    配色沿用全站：#111111 底 / #f3f3f3 卡 / #6b7fa6 蓝灰对勾
  -->
  <rect width="512" height="512" fill="#111111"/>
  <rect x="140" y="150" width="232" height="212" rx="34" fill="#f3f3f3"/>
  <rect x="176" y="188" width="104" height="28" rx="14" fill="#111111"/>
  <rect x="176" y="240" width="148" height="24" rx="12" fill="#7c8aa4"/>
  <rect x="176" y="288" width="110" height="24" rx="12" fill="#111111" fill-opacity="0.5"/>
  <path d="M300 292 l26 28 l46 -52" fill="none" stroke="#6b7fa6" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
