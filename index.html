    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

    <title>Classworks 作业板</title>
    <!-- 内联开屏：外链 CSS 到达前先铺深色底防白屏闪烁；.boot-splash 在 Vue 挂载时被整体替换 -->
    <style>
      html {
        background: #111111;
        color-scheme: dark;
      }

      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111111;
      }

      .boot-splash::after {
        content: "";
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: rgba(174, 191, 221, 0.9);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash::after {
          animation: none;
        }
      }
    </style>

    <meta name="description" content="班级作业看板：按日期记录语文、数学、英语、物理、化学、地理六科作业，支持教室大屏展示与多端同步。" />
